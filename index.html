
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furry Community | Join Us</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 20% 20%, #59358c, transparent 40%),
    radial-gradient(circle at 80% 80%, #174d70, transparent 40%),
    #100d20;
  overflow-x: hidden;
}

.card {
  width: 100%;
  max-width: 850px;
  padding: 12px;
  border-radius: 30px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 30px 90px rgba(0,0,0,.5);
  backdrop-filter: blur(20px);
}

.hero {
  min-height: 520px;
  padding: 55px;
  border-radius: 22px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background:
    linear-gradient(0deg, #130f27 5%, transparent 90%),
    radial-gradient(circle at 75% 25%, #a66cff, transparent 30%),
    linear-gradient(135deg, #38245f, #17264b);
}

.character {
  position: absolute;
  top: 65px;
  right: 15%;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 25%, #fff, #d8b4ff 15%, #9655e9 55%, #38215f 90%);
  box-shadow: 0 20px 70px #a15bff80,
              inset -20px -20px 35px #1b103d80;
  animation: float 4s ease-in-out infinite;
}

.character::before,
.character::after {
  content: "";
  position: absolute;
  top: -48px;
  width: 65px;
  height: 100px;
  background: linear-gradient(145deg, #f0dcff, #a56aff);
  border-radius: 90% 10% 50% 30%;
}

.character::before {
  left: 20px;
  transform: rotate(-15deg);
}

.character::after {
  right: 20px;
  transform: scaleX(-1) rotate(-15deg);
}

.orbit {
  position: absolute;
  width: 280px;
  height: 100px;
  top: 115px;
  right: 10%;
  border: 2px solid #ffffff55;
  border-radius: 50%;
  transform: rotate(-25deg);
}

.sparkle {
  position: absolute;
  color: white;
  font-size: 25px;
  animation: sparkle 3s infinite;
}

.s1 { top: 60px; right: 45%; }
.s2 { top: 220px; right: 8%; }
.s3 { top: 35px; right: 8%; }

.content {
  position: relative;
  z-index: 2;
  max-width: 530px;
}

.tag {
  display: inline-block;
  padding: 9px 15px;
  border: 1px solid #ffffff40;
  border-radius: 30px;
  background: #ffffff15;
  color: #e4d1ff;
  font-size: 12px;
  letter-spacing: 2px;
}

h1 {
  margin: 22px 0 15px;
  font-size: clamp(45px, 9vw, 75px);
  line-height: .95;
  letter-spacing: -3px;
}

.description {
  color: #d7cde8;
  line-height: 1.8;
  max-width: 440px;
  margin-bottom: 30px;
}

.join {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 18px 30px;
  border-radius: 15px;
  color: #160d2b;
  background: linear-gradient(110deg, #ead9ff, #a9ddff);
  font-weight: bold;
  font-size: 15px;
  text-decoration: none;
  box-shadow: 0 12px 35px #9868ff55;
  transition: .3s;
}

.join:hover {
  transform: translateY(-5px) scale(1.04);
  box-shadow: 0 20px 45px #9868ff88;
}

.join:active {
  transform: scale(.96);
}

.footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 18px 10px 5px;
  color: #a99bbd;
  font-size: 12px;
}

@keyframes float {
  0%,100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-18px) rotate(5deg); }
}

@keyframes sparkle {
  0%,100% { opacity: .3; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.3); }
}

@media(max-width:550px) {
  .hero {
    min-height: 560px;
    padding: 28px;
  }

  .character {
    width: 140px;
    height: 140px;
    right: 12%;
    top: 65px;
  }

  .character::before,
  .character::after {
    width: 48px;
    height: 75px;
    top: -35px;
  }

  .orbit {
    width: 210px;
    right: 5%;
  }

  .footer {
    font-size: 10px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="card">

<section class="hero">

<div class="character"></div>
<div class="orbit"></div>

<span class="sparkle s1">✦</span>
<span class="sparkle s2">✧</span>
<span class="sparkle s3">✦</span>

<div class="content">

<span class="tag">✦ WELCOME TO OUR COMMUNITY</span>

<h1>Find Your<br>Pack.</h1>

<p class="description">
A place where furry fans meet, make friends,
share creativity, and create unforgettable memories.
Join our community and find your people!
</p>

<a class="join"
   href="http://127.0.0.1:8080/"
   target="_blank"
   rel="noopener noreferrer">
   Join Community <span>↗</span>
</a>

</div>
</section>

<div class="footer">
<span>FURRY COMMUNITY</span>
<span>Be Kind • Be Creative • Be Yourself</span>
</div>

</main>

</body>
  </html>
